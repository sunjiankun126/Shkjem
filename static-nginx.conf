server {
    listen 5001;
    server_name 60.204.227.222;
    access_log off; 
    error_log /var/log/nginx/static-error.log warn;

    # ========== 1. 全局放行 OPTIONS 预检请求 (跨域必备，解决前端OPTIONS 403)
    if ($request_method = OPTIONS) {
        return 200;
    }

    # ========== 2. images目录 - 目录浏览+跨域+性能优化 (支持多层子目录 /images/2018/0529/)
    location /images {
        root /data/static;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        expires 30d;
        add_header Cache-Control public;
        sendfile on;
        tcp_nopush on;
        # 标准完整跨域配置 - 允许所有域名跨域访问
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
    }

    # ========== 3. videos目录 - 目录浏览+跨域+视频流式播放
    location /videos {
        root /data/static;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        expires 1h;
        add_header Cache-Control public;
        add_header Accept-Ranges bytes;
        sendfile on;
        # 标准完整跨域配置
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
    }

    # ========== 4. 图片文件匹配 - 核心修复防盗链+跨域 (支持所有图片格式+多层子目录)
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        root /data/static;
        expires 30d;
        add_header Cache-Control public;
        sendfile on;
        tcp_nopush on;
        
        # ✅ 防盗链适配跨域【核心修复】：新增所有合法跨域场景，不会再拦截前端请求
        valid_referers none blocked 60.204.227.222 60.204.227.222:5001 localhost *.localhost 127.0.0.1;
        if ($invalid_referer) {
            return 403;
        }
        
        # ✅ 标准跨域配置 - 跨域核心
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
    }

    # ========== 5. 视频文件匹配 - 跨域+视频优化+防盗链适配
    location ~* \.(mp4|flv|mov|avi|mkv|webm|wmv)$ {
        root /data/static;
        expires 1h;
        add_header Cache-Control public;
        add_header Accept-Ranges bytes;
        client_body_buffer_size 10M;
        proxy_buffer_size 4k;
        
        # ✅ 防盗链适配跨域
        valid_referers none blocked 60.204.227.222 60.204.227.222:5001 localhost *.localhost 127.0.0.1;
        if ($invalid_referer) {
            return 403;
        }
        
        # ✅ 标准跨域配置
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
    }

    # ========== 6. 兜底规则 - 非法路径返回403，保留安全防护
    location / {
        return 403;
    }
}
